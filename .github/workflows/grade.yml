# Reusable grader workflow for BatSchool G-projects. A mentee repository calls
# it at a published tag (see README); the platform accepts the report only from
# this file at an allowed tag (OIDC claim job_workflow_ref).
name: grade

on:
  workflow_call:
    inputs:
      craft:
        description: Craft id, e.g. ormka
        required: true
        type: string
      stage:
        description: Stage number, e.g. 12
        required: true
        type: string
      services:
        description: 'Service profile: none or a comma list of postgres, redis, rabbitmq, kafka'
        required: false
        type: string
        default: none
      platform-url:
        description: Report endpoint
        required: false
        type: string
        default: https://school.bondiano.com/api/code/ci-report
      audience:
        description: OIDC audience the platform expects
        required: false
        type: string
        default: https://school.bondiano.com
      container:
        description: Build the repository Dockerfile, run it next to the services and let the grader probe it
        required: false
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

jobs:
  grade:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    # An empty image skips the service, so one job covers every profile.
    services:
      postgres:
        image: ${{ contains(inputs.services, 'postgres') && 'postgres:17-alpine' || '' }}
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s
          --health-timeout 2s --health-retries 30
      redis:
        image: ${{ contains(inputs.services, 'redis') && 'redis:7-alpine' || '' }}
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s
          --health-timeout 2s --health-retries 30
      rabbitmq:
        image: ${{ contains(inputs.services, 'rabbitmq') && 'rabbitmq:4-alpine' || '' }}
        # guest may only log in over loopback, and the mapped port is not loopback inside.
        env:
          RABBITMQ_DEFAULT_USER: grader
          RABBITMQ_DEFAULT_PASS: grader
        ports: ['5672:5672']
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping" --health-interval 3s
          --health-timeout 5s --health-retries 40
      # The image defaults to a single KRaft node advertised on localhost:9092.
      kafka:
        image: ${{ contains(inputs.services, 'kafka') && 'apache/kafka:4.3.2' || '' }}
        ports: ['9092:9092']
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"
          --health-interval 3s --health-timeout 10s --health-retries 40
    env:
      CRAFT: ${{ inputs.craft }}
      STAGE: ${{ inputs.stage }}
      SERVICES: ${{ inputs.services }}
      CONTAINER: ${{ inputs.container }}
      SHA: ${{ github.sha }}
    steps:
      - name: Check inputs
        run: |
          printf '%s' "$CRAFT" | grep -Eqx '[a-z0-9-]{1,40}' || { echo "bad craft: $CRAFT"; exit 1; }
          printf '%s' "$STAGE" | grep -Eqx '[0-9]{1,3}' || { echo "bad stage: $STAGE"; exit 1; }
          echo "IMAGE=ghcr.io/bondiano/py-grader-$CRAFT:$STAGE" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: src
          persist-credentials: false

      - name: Pull grader
        run: |
          docker pull "$IMAGE"
          task="$(docker inspect -f '{{ index .Config.Labels "com.bondiano.school.task" }}' "$IMAGE")"
          [ -n "$task" ] || { echo "grader image has no task label"; exit 1; }
          echo "TASK=$task" >> "$GITHUB_ENV"

      # Container mode: this workflow, not the repository, records the facts the grader
      # checks (user, size, health, stop), so a checkout cannot forge them.
      - name: Build the image
        if: inputs.container
        run: docker build --build-arg "GIT_SHA=$SHA" -t grade-app:ci src

      - name: Run the image and record facts
        if: inputs.container
        run: |
          [ "$SERVICES" != none ] || { echo "container mode needs services"; exit 1; }
          facts="$RUNNER_TEMP/facts"
          mkdir -p "$facts"
          token() { head -c 96 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 64; }
          secret_key="$(token)"; media_key="$(token)"; metrics_token="$(token)"
          for value in "$secret_key" "$media_key" "$metrics_token"; do echo "::add-mask::$value"; done
          echo "METRICS_TOKEN=$metrics_token" >> "$GITHUB_ENV"
          {
            echo "DJANGO_SECRET_KEY=$secret_key"
            echo "MEDIA_SIGNING_KEY=$media_key"
            echo "METRICS_TOKEN=$metrics_token"
            echo "DATABASE_URL=postgresql://postgres:postgres@localhost:5432/postgres"
            echo "REDIS_URL=redis://localhost:6379/0"
            echo "CACHE_URL=locmem://"
            echo "DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1"
            echo "DJANGO_TRUSTED_PROXIES=127.0.0.1"
            echo "DJANGO_SECURE=1"
            echo "SITE_URL=https://localhost"
          } > "$RUNNER_TEMP/app.env"

          set +e
          docker run --rm --network host --env-file "$RUNNER_TEMP/app.env" grade-app:ci python manage.py release
          release=$?
          set -e

          healthy() {
            started=$(date +%s)
            while [ $(( $(date +%s) - started )) -lt 90 ]; do
              status="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$1")"
              case "$status" in
                healthy) echo $(( $(date +%s) - started )); return 0 ;;
                none) return 1 ;;
              esac
              [ "$(docker inspect -f '{{.State.Running}}' "$1")" = true ] || return 1
              sleep 1
            done
            return 1
          }

          docker run -d --name grade-app-1 --network host --env-file "$RUNNER_TEMP/app.env" grade-app:ci
          seconds="$(healthy grade-app-1 || echo null)"
          for path in / /livez /readyz /version /no-such-page; do
            curl -s -o /dev/null -H 'X-Forwarded-Proto: https' "http://127.0.0.1:8000$path" || true
          done
          docker logs grade-app-1 > "$facts/logs.txt" 2>&1
          stop_started=$(date +%s.%N)
          docker stop -t 30 grade-app-1 > /dev/null
          stop_seconds="$(awk -v a="$stop_started" -v b="$(date +%s.%N)" 'BEGIN { printf "%.2f", b - a }')"
          exit_code="$(docker inspect -f '{{.State.ExitCode}}' grade-app-1)"
          docker rm grade-app-1 > /dev/null

          # A fresh copy for the grader's live probes.
          docker run -d --name grade-app --network host --env-file "$RUNNER_TEMP/app.env" grade-app:ci
          healthy grade-app > /dev/null || echo "grade-app is not healthy"

          jq -n \
            --arg user "$(docker image inspect -f '{{.Config.User}}' grade-app:ci)" \
            --argjson healthcheck "$(docker image inspect -f '{{if .Config.Healthcheck}}true{{else}}false{{end}}' grade-app:ci)" \
            --argjson size "$(docker image inspect -f '{{.Size}}' grade-app:ci)" \
            --argjson release "$release" --argjson healthy "$seconds" \
            --argjson stop_seconds "$stop_seconds" --argjson exit_code "$exit_code" \
            --arg secret_key "$secret_key" --arg media_key "$media_key" --arg metrics_token "$metrics_token" \
            '{user: $user, healthcheck: $healthcheck, size_bytes: $size, release_exit_code: $release,
              healthy_seconds: $healthy, stop: {seconds: $stop_seconds, exit_code: $exit_code},
              secrets: [$secret_key, $media_key, $metrics_token]}' > "$facts/facts.json"
          chmod -R a+rX "$facts"

      - name: Run grader
        run: |
          work="$RUNNER_TEMP/work"
          cp -R src "$work" && rm -rf "$work/.git" && chmod -R a+rwX "$work"
          network=none
          [ "$SERVICES" = none ] || network=host
          set -- -e DATABASE_URL=postgresql://postgres:postgres@localhost:5432/postgres \
            -e REDIS_URL=redis://localhost:6379/0 \
            -e RABBIT_URL=amqp://grader:grader@localhost:5672/ -e KAFKA_BOOTSTRAP=localhost:9092
          if [ "$CONTAINER" = true ]; then
            set -- "$@" -v "$RUNNER_TEMP/facts:/facts:ro" -e SHPIL_FACTS=/facts \
              -e APP_URL=http://127.0.0.1:8000 -e EXPECTED_SHA="$SHA" -e METRICS_TOKEN="$METRICS_TOKEN"
          fi
          set +e
          docker run --rm --network "$network" --read-only --tmpfs /tmp \
            --cpus 2 --memory 2g --pids-limit 512 "$@" \
            -v "$work:/work" "$IMAGE" > "$RUNNER_TEMP/grader.jsonl"
          echo "pytest exit code: $?"
          set -e
          jq -R -s 'split("\n") | map(fromjson? | select(type == "object" and .event == "test") | del(.event))' \
            "$RUNNER_TEMP/grader.jsonl" > "$RUNNER_TEMP/tests.json"
          jq -r '.[] | (if .passed then "PASS " else "FAIL " end) + .name + (if .message then "\n     " + .message else "" end)' \
            "$RUNNER_TEMP/tests.json"

      - name: Report to the platform
        env:
          PLATFORM_URL: ${{ inputs.platform-url }}
          AUDIENCE: ${{ inputs.audience }}
        run: |
          token="$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUDIENCE" | jq -r .value)"
          echo "::add-mask::$token"
          jq -n --arg task "$TASK" --arg sha "$SHA" --slurpfile tests "$RUNNER_TEMP/tests.json" \
            '{task: $task, sha: $sha, tests: $tests[0]}' > "$RUNNER_TEMP/report.json"
          curl -fsS -X POST "$PLATFORM_URL" \
            -H "Authorization: Bearer $token" -H 'Content-Type: application/json' \
            --data-binary "@$RUNNER_TEMP/report.json"
          echo

      - name: Verdict
        run: |
          total="$(jq length "$RUNNER_TEMP/tests.json")"
          passed="$(jq 'map(select(.passed)) | length' "$RUNNER_TEMP/tests.json")"
          echo "### $TASK: $passed / $total" >> "$GITHUB_STEP_SUMMARY"
          [ "$total" -gt 0 ] && [ "$passed" = "$total" ]
